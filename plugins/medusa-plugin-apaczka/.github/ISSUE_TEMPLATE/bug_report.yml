name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste your Apaczka `appSecret`** or full API payloads with customer data.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: medusa-version
    attributes:
      label: Medusa version
      placeholder: "2.22.3"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Apaczka environment
      options: [production, sandbox]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Lines starting with `[apaczka]` from your Medusa server log.
      render: shell
  - type: textarea
    id: config
    attributes:
      label: Plugin options (without secrets)
      render: ts
